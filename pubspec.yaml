name: oreguru
description: "オレグル (Oreguru) - 클레이모피즘 & 턱시도 고양이 '구루냥' 기반 맛집 탐색 앱"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_maps_flutter: ^2.9.0
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  rive: ^0.13.14
  lottie: ^3.1.3
  url_launcher: ^6.3.1
  http: ^1.6.0
  geolocator: ^13.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/clay/
